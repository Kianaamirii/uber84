<!DOCTYPE html>
<html>
<head>
    <title>Uber Ride Simulation</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            padding: 40px;
        }
        .box {
            background: white;
            padding: 20px;
            width: 400px;
            border-radius: 10px;
        }
        input, button {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
        }
        .result {
            margin-top: 15px;
            background: #e3f2fd;
            padding: 10px;
        }
    </style>
</head>

<body>
<div class="box">
    <h2>Uber Ride Simulation</h2>

    <form method="post">
        <input type="text" name="name" placeholder="Passenger Name" required>

        <input type="number" step="any" name="px" placeholder="Passenger X" required>
        <input type="number" step="any" name="py" placeholder="Passenger Y" required>

        <input type="number" step="any" name="dx" placeholder="Destination X" required>
        <input type="number" step="any" name="dy" placeholder="Destination Y" required>

        <button type="submit">Request Ride</button>
    </form>

    {% if result %}
        <div class="result">
            {% if result.error %}
                <strong>{{ result.error }}</strong>
            {% else %}
                <p><b>Passenger:</b> {{ result.passenger }}</p>
                <p><b>Nearest Driver:</b> {{ result.driver }}</p>
                <p><b>Fare:</b> {{ result.fare }} ₺</p>
            {% endif %}
        </div>
    {% endif %}
</div>
</body>
</html>
